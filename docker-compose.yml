services:
  postgres:
    image: postgres:15-alpine
    container_name: stayhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: stayhub
      POSTGRES_PASSWORD: stayhub_dev_pwd
      POSTGRES_DB: stayhub
    ports:
      - "5432:5432"
    volumes:
      - stayhub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayhub -d stayhub"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stayhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - stayhub_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  stayhub_pgdata:
  stayhub_redisdata:
